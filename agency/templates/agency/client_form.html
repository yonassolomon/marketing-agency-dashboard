{% extends "agency/base.html" %}
{% block title %}{{ title }} — Agency CRM{% endblock %}
{% block content %}
<h1 class="h4 mb-3">{{ title }}</h1>
<div class="card shadow-sm" style="max-width: 32rem;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="{{ form.name.id_for_label }}">Name</label>
        {{ form.name }}
        {% for err in form.name.errors %}<div class="text-danger small">{{ err }}</div>{% endfor %}
      </div>
      <button type="submit" class="btn btn-primary">Save</button>
      {% if client %}
      <a href="{% url 'client_detail' client.pk %}" class="btn btn-outline-secondary">Cancel</a>
      {% else %}
      <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
      {% endif %}
    </form>
  </div>
</div>
{% endblock %}
